<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Форматтер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #0d0d0d;
            color: #c8c8c8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #000000;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }

        .logo::before {
            content: '<>';
            font-size: 14px;
            color: #aaaaaa;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        h1 {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .subtitle {
            color: #666666;
            margin-bottom: 20px;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .controls {
            width: 100%;
            max-width: 1400px;
            margin: 0 0 16px 0;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 18px;
            background-color: #1a1a1a;
            color: #d0d0d0;
            border: 1px solid #333333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 500;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: #252525;
            border-color: #444444;
            color: #ffffff;
        }

        button:active {
            background-color: #2e2e2e;
            transform: translateY(0);
        }

        button.primary {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: #e0e0e0;
            border-color: #e0e0e0;
            color: #000000;
        }

        .container {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 1400px;
            height: 60vh;
        }

        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }

        label {
            font-weight: 500;
            padding: 10px 16px;
            color: #777777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        label span {
            color: #888888;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            font-size: 12px;
        }

        textarea {
            flex: 1;
            background-color: #141414;
            color: #d4d4d4;
            border: none;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }

        textarea::placeholder {
            color: #444444;
        }

        textarea:focus {
            background-color: #161616;
        }

        .rules {
            max-width: 1400px;
            width: 100%;
            background-color: #141414;
            padding: 20px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid #2a2a2a;
        }

        .rules h3 {
            margin-top: 0;
            color: #cccccc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .rules ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        .rules li {
            margin-bottom: 6px;
            color: #aaaaaa;
        }

        .success {
            color: #aaaaaa;
            font-weight: normal;
        }

        .priority {
            color: #cccccc;
            font-weight: normal;
        }

        .final {
            color: #cccccc;
            font-weight: normal;
        }

        code {
            background-color: #1e1e1e;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            color: #bbbbbb;
            font-size: 12px;
        }

        .status-bar {
            width: 100%;
            max-width: 1400px;
            margin-top: 16px;
            padding: 10px 16px;
            background-color: #000000;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            font-size: 12px;
            color: #666666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-bar::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #555555;
            border-radius: 50%;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>C++ Форматтер</h1>
        </div>
        <div class="subtitle" style="margin: 0;">Исправление ошибок оформления</div>
    </header>

    <div class="controls">
        <button class="secondary" onclick="loadExample()"> Загрузить пример</button>
        <button class="secondary" onclick="copyCode()">📋 Копировать</button>
        <button class="primary" onclick="formatCode()"> Форматировать</button>
    </div>

    <div class="container">
        <div class="box">
            <label>Исходный код</label>
            <textarea id="input" placeholder="Вставьте ваш C++ код сюда..."></textarea>
        </div>
        <div class="box">
            <label>Отформатированный код <span id="status"></span></label>
            <textarea id="output" readonly placeholder="Здесь появится результат..."></textarea>
        </div>
    </div>

    <div class="status-bar">Готов к работе</div>

    <script>
        class CppFormatter {
            static format(code) {
                if (!code.trim()) return '';
                let hasInclude = /#include\s*<[^>]+>/.test(code);
                if (hasInclude) {
                    code = code.replace(/#include\s*<[^>]+>\s*\n?/g, '');
                    code = '#include <bits/stdc++.h>\n' + code;
                }

                let lines = code.split('\n');
                let result = [];
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    
                    line = line.replace(/\s+$/, '');
                    
                    if (line.trim() === '') {
                        result.push('');
                        continue;
                    }
                    line = line.replace(/>\s*>/g, '>>');
                    line = line.replace(/<\s*</g, '<<');
                    line = line.replace(/\b(cin|cout)\s*(<<|>>)\s*/g, '$1 $2 ');
                    line = line.replace(/\s*(<<|>>)\s*\b(cin|cout)\b/g, ' $1 $2');
                    line = line.replace(/([^<>\s])(<<|>>)/g, '$1 $2');
                    line = line.replace(/(<<|>>)([^<>\s])/g, '$1 $2');
                    line = line.replace(/#\s*include\s*<\s*([^>]+?)\s*>/g, '#include <$1>');
                    line = line.replace(/(\w)\s+\(/g, '$1(');
                    line = line.replace(/\(\s+/g, '(');
                    line = line.replace(/\s+\)/g, ')');
                    line = line.replace(/\b(for|while|if|switch|catch)\s*\(/g, '$1 (');
                    if (!line.trim().startsWith('#include')) {
                        line = line.replace(/([^=\s])\s*==\s*([^=\s])/g, '$1 == $2');
                        line = line.replace(/([^=\s])\s*!=\s*([^=\s])/g, '$1 != $2');
                        line = line.replace(/([^=\s])\s*<=\s*([^=\s])/g, '$1 <= $2');
                        line = line.replace(/([^=\s])\s*>=\s*([^=\s])/g, '$1 >= $2');
                        line = line.replace(/([^=\s])\s*=\s*([^=\s])/g, '$1 = $2');
                        line = line.replace(/([^<>\s])\s*<\s*([^=\s])/g, '$1 < $2');
                        line = line.replace(/([^<>\s])\s*>\s*([^=\s])/g, '$1 > $2');
                        line = line.replace(/([^+\s])\s*\+\s*([^+\s])/g, '$1 + $2');
                        line = line.replace(/([^-+\s])\s*-\s*([^-+\s])/g, '$1 - $2');
                        line = line.replace(/([^\*\s])\s*\*\s*([^\*\s])/g, '$1 * $2');
                        line = line.replace(/([^\/\s])\s*\/\s*([^\/\s])/g, '$1 / $2');
                    }
                    line = line.replace(/(\w)\s*\+\+/g, '$1++');
                    line = line.replace(/(\w)\s*--/g, '$1--');
                    line = line.replace(/\bfor\s*\(\s*([^:;]+?)\s*:\s*([^;)]+?)\s*\)/g, 'for ($1 : $2)');
                    line = line.replace(/,([^\s])/g, ', $1');
                    line = line.replace(/\s+;/g, ';');
                    
                    if (!line.match(/^\s*(for|while|if|switch)\s*\(/)) {
                        line = line.replace(/;\s+([a-zA-Z_])/g, ';\n$1');
                    }
                    if (line.trim() === '{' && result.length > 0) {
                        let prev = result[result.length - 1];
                        result[result.length - 1] = prev.replace(/\s*$/, ' {');
                        continue;
                    }
                    line = line.replace(/(\S)\{/g, '$1 {');
                    if (line.trim().match(/^(public|private|protected):/)) {
                        line = ' ' + line.trim();
                    }
                    result.push(line);
                }
                let finalResult = [];
                for (let i = 0; i < result.length; i++) {
                    let line = result[i];
                    finalResult.push(line);
                    if (line.includes('{')) {
                        if (i + 1 < result.length && result[i+1].trim() === '') {
                            i++;
                        }
                    }
                }
                
                let cleanedResult = [];
                for (let i = 0; i < finalResult.length; i++) {
                    if (finalResult[i].trim() === '}') {
                        while (cleanedResult.length > 0 && cleanedResult[cleanedResult.length - 1].trim() === '') {
                            cleanedResult.pop();
                        }
                    }
                    cleanedResult.push(finalResult[i]);
                }
                let indentedResult = [];
                let indentLevel = 0;
                for (let line of cleanedResult) {
                    let trimmed = line.trim();
                    if (!trimmed) {
                        indentedResult.push('');
                        continue;
                    }
                    
                    if (trimmed.startsWith('}')) {
                        indentLevel = Math.max(0, indentLevel - 1);
                    }
                    
                    let indent = '    '.repeat(indentLevel);
                    indentedResult.push(indent + trimmed);
                    
                    if (trimmed.endsWith('{')) {
                        indentLevel++;
                    }
                }
                
                let finalCode = indentedResult.join('\n');
                finalCode = finalCode.replace(/>\s+>/g, '>>');
                finalCode = finalCode.replace(/<\s+</g, '<<');
                finalCode = finalCode.replace(/!\s+=/g, '!=');
                finalCode = finalCode.replace(/=\s+=/g, '==');
                finalCode = finalCode.replace(/>\s+=/g, '>=');
                finalCode = finalCode.replace(/<\s+=/g, '<=');
                finalCode = finalCode.replace(/\b(cin|cout)\s*(<<|>>)\s*/g, '$1 $2 ');
                finalCode = finalCode.replace(/\s*(<<|>>)\s*\b(cin|cout)\b/g, ' $1 $2');
                finalCode = finalCode.replace(/([^<>\s])(<<|>>)/g, '$1 $2');
                finalCode = finalCode.replace(/(<<|>>)([^<>\s])/g, '$1 $2');
                finalCode = finalCode.replace(/([^=\s])\s*==\s*([^=\s])/g, '$1 == $2');
                finalCode = finalCode.replace(/([^=\s])\s*!=\s*([^=\s])/g, '$1 != $2');
                finalCode = finalCode.replace(/([^=\s])\s*<=\s*([^=\s])/g, '$1 <= $2');
                finalCode = finalCode.replace(/([^=\s])\s*>=\s*([^=\s])/g, '$1 >= $2');
                finalCode = finalCode.replace(/^(\s*)(.*)/gm, (match, indent, content) => {
                    return indent + content.replace(/  +/g, ' ');
                });
                return finalCode;
            }
        }

        function formatCode() {
            const input = document.getElementById('input').value;
            if (!input.trim()) return;
            
            const formatted = CppFormatter.format(input);
            document.getElementById('output').value = formatted;
            
            const status = document.getElementById('status');
            status.textContent = '✓ Успешно';
            setTimeout(() => { status.textContent = ''; }, 2000);
        }

        function copyCode() {
            const output = document.getElementById('output');
            if (!output.value) return;
            
            navigator.clipboard.writeText(output.value).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = '✅ Скопировано';
                setTimeout(() => { 
                    btn.innerText = originalText; 
                }, 2000);
            });
        }

        function loadExample() {
            document.getElementById('input').value = `#include < iostream>
#include < string>
using namespace std;

int main() {
    int a, b;
    cin>>  a > >b;
    if (a ! = b){
         if (a = = b) {
          if (a > = b) {
             if (a < = b){
                    cout < < a;
                }
            }
        }
    }
    return 0;
}`;
        }
    </script>
</body>
</html>
